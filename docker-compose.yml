services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.13.0
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data/open-webui:/app/backend/data
    environment:
      - OPENAI_API_BASE_URL=https://openrouter.ai/api/v1
      - OPENAI_API_KEY=${OPENROUTER_API_KEY}
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
      - OPENAI_API_KEY_ENABLED=true
      - WEBUI_NAME=Agentic Workspace
      - ENABLE_SIGNUP=true
      - DEFAULT_USER_ROLE=admin
      - ENABLE_WEB_SEARCH=true
      - WEB_SEARCH_ENGINE=searxng
      - SEARXNG_QUERY_URL=http://searxng:8080/search?q=<query>
      - WEB_SEARCH_RESULT_COUNT=5
      - ENABLE_EVALUATION_ARENA_MODELS=true
      - TERMINAL_SERVER_CONNECTIONS=[{"id":"local","name":"Local Terminal","url":"http://open-terminal:8000","key":"${OPEN_TERMINAL_API_KEY}","auth_type":"bearer","enabled":true,"config":{"chat_uploads":"filesystem"}}]
      - ENABLE_WEBSOCKET_SUPPORT=false
    depends_on:
      - searxng
    networks:
      - workspace
    extra_hosts:
      - "host.docker.internal:host-gateway"

  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./searxng:/etc/searxng
    environment:
      - SEARXNG_BASE_URL=http://127.0.0.1:8888/
      - SEARXNG_SECRET=${SEARXNG_SECRET}
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    networks:
      - workspace

  open-terminal:
    image: ghcr.io/open-webui/open-terminal:slim
    container_name: open-terminal
    restart: unless-stopped
    profiles: ["agents"]
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - OPEN_TERMINAL_API_KEY=${OPEN_TERMINAL_API_KEY}
    volumes:
      - open-terminal-home:/home/user
      - ${AGENT_WORKSPACE_DIR:-./sources}:/workspace:ro
    networks:
      - workspace

networks:
  workspace:
    driver: bridge

volumes:
  open-terminal-home:
