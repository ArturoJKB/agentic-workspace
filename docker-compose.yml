services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.13.3
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data/open-webui:/app/backend/data
    environment:
      - OPENAI_API_BASE_URL=https://openrouter.ai/api/v1
      - OPENAI_API_KEY=${OPENROUTER_API_KEY}
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
      - OPENAI_API_KEY_ENABLED=true
      - WEBUI_NAME=Agentic Workspace
      - ENABLE_SIGNUP=true
      - DEFAULT_USER_ROLE=admin
      - ENABLE_WEB_SEARCH=true
      - WEB_SEARCH_ENGINE=searxng
      - SEARXNG_QUERY_URL=http://searxng:8080/search?q=<query>
      - WEB_SEARCH_RESULT_COUNT=5
      - ENABLE_EVALUATION_ARENA_MODELS=true
      - TERMINAL_SERVER_CONNECTIONS=[{"id":"local","name":"Local Terminal","url":"http://open-terminal:8000","key":"${OPEN_TERMINAL_API_KEY}","auth_type":"bearer","enabled":true,"config":{"chat_uploads":"filesystem"}}]
      - ENABLE_WEBSOCKET_SUPPORT=false
    depends_on:
      - searxng
    networks:
      - workspace
    extra_hosts:
      - "host.docker.internal:host-gateway"

  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./searxng:/etc/searxng
    environment:
      - SEARXNG_BASE_URL=http://127.0.0.1:8888/
      - SEARXNG_SECRET=${SEARXNG_SECRET}
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    networks:
      - workspace

  open-terminal:
    image: ghcr.io/open-webui/open-terminal:slim
    container_name: open-terminal
    restart: unless-stopped
    profiles: ["agents"]
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - OPEN_TERMINAL_API_KEY=${OPEN_TERMINAL_API_KEY}
    volumes:
      - open-terminal-home:/home/user
      - ${AGENT_WORKSPACE_DIR:-./sources}:/workspace:ro
    networks:
      - workspace

  redis:
    image: docker.io/library/redis:8.6.5-alpine
    container_name: omniroute-redis
    restart: unless-stopped
    profiles: ["gateway"]
    volumes:
      - redis-data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - workspace

  omniroute:
    image: diegosouzapw/omniroute:latest
    container_name: omniroute
    restart: unless-stopped
    stop_grace_period: 40s
    profiles: ["gateway"]
    environment:
      - DATA_DIR=/app/data
      - REDIS_URL=redis://redis:6379
      - REQUIRE_API_KEY=false
      - INITIAL_PASSWORD=${GATEWAY_INITIAL_PASSWORD}
      - OMNIROUTE_MEMORY_MB=1024
    ports:
      - "127.0.0.1:20128:20128"
      - "127.0.0.1:20129:20129"
      - "127.0.0.1:20132:20132"
    volumes:
      - ./data/omniroute:/app/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - workspace

networks:
  workspace:
    driver: bridge

volumes:
  open-terminal-home:
  redis-data:
